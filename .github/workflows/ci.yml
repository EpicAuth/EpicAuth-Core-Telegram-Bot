name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Apply migrations
        env:
          DATABASE_URL: file:./prisma/ci.db
        run: bun run db:deploy

      - name: Typecheck
        run: bun run typecheck

      - name: Store smoke test
        env:
          DATABASE_URL: file:./prisma/ci.db
        run: bun run test:store

      - name: Module loader smoke test
        run: bun run test:loader

      - name: Verify Docker image builds
        run: docker build --target production -t epicauth-bot:ci .