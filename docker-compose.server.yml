services:
  EpicAuth-Telegram-bot:
    image: ${IMAGE_REPO:-ghcr.io/epicauth/epicauth-core-telegram-bot}:${TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment:
      TELEGRAM_API_KEY: ${TELEGRAM_API_KEY:?TELEGRAM_API_KEY is required - add it in the stack environment variables}
      # Keep this literal. It must be an absolute path on the volume, not the
      # relative path used locally in .env.
      DATABASE_URL: file:/data/epicauth.db
    volumes:
      - bot-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data: